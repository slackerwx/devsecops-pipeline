name: image-build
description: Build the image for the runner arch with buildx (loaded into the daemon for scanning) and compute publish tags.
inputs:
  context:
    required: true
  dockerfile:
    description: Relative to context
    default: Dockerfile
  image-name:
    required: true
  platforms:
    default: linux/amd64
  build-args:
    default: ""
  scope:
    description: buildx gha cache scope (use the working-directory slug)
    default: root
outputs:
  local-tag:
    value: ${{ steps.cfg.outputs.local-tag }}
  tags:
    value: ${{ steps.meta.outputs.tags }}
  labels:
    value: ${{ steps.meta.outputs.labels }}
runs:
  using: composite
  steps:
    - id: cfg
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
        PLATFORMS: ${{ inputs.platforms }}
      run: |
        set -euo pipefail
        echo "local-tag=devsecops-local/${SCOPE}:scan" >> "$GITHUB_OUTPUT"
        case "$PLATFORMS" in ""|linux/amd64) echo "qemu=false" ;; *) echo "qemu=true" ;; esac >> "$GITHUB_OUTPUT"
    - if: steps.cfg.outputs.qemu == 'true'
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
    - id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
      with:
        images: ${{ inputs.image-name }}
        tags: |
          type=sha,format=long
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/${{ inputs.dockerfile }}
        load: true
        push: false
        tags: ${{ steps.cfg.outputs.local-tag }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha,scope=${{ inputs.scope }}
        cache-to: type=gha,scope=${{ inputs.scope }},mode=max
        provenance: false
        sbom: false
