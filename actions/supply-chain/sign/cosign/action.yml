name: cosign-sign
description: Sign an image by digest with Cosign (keyless OIDC or a key from env) and attest its SPDX SBOM.
inputs:
  image:
    required: true
  digest:
    required: true
  mode:
    description: keyless | key
    default: keyless
  format:
    description: legacy | bundle
    default: legacy
  sbom:
    description: Path to the SPDX JSON predicate
    required: true
  output-dir:
    default: ""
outputs:
  signed:
    value: ${{ steps.sign.outputs.signed }}
  issuer:
    value: ${{ steps.sign.outputs.issuer }}
  output-dir:
    value: ${{ steps.sign.outputs.output-dir }}
runs:
  using: composite
  steps:
    - id: cfg
      shell: bash
      run: |
        set -euo pipefail
        ROOT="$(cd "$GITHUB_ACTION_PATH/../../../.." && pwd)"
        set -a; . "$ROOT/config/versions.env"; set +a
        echo "cosign-version=$COSIGN_VERSION" >> "$GITHUB_OUTPUT"
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: ${{ steps.cfg.outputs.cosign-version }}
    - id: sign
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
        MODE: ${{ inputs.mode }}
        FORMAT: ${{ inputs.format }}
        SBOM: ${{ inputs.sbom }}
        OUT_IN: ${{ inputs.output-dir }}
        COSIGN_YES: "true"
      run: |
        set -euo pipefail
        OUT="${OUT_IN:-$RUNNER_TEMP/devsecops/sign}"; mkdir -p "$OUT"
        ref="${IMAGE}@${DIGEST}"
        legacy_flags() {
          local cmd="$1" flags=""
          for opt in --new-bundle-format=false --use-signing-config=false --registry-referrers-mode=legacy; do
            if cosign "$cmd" --help 2>&1 | grep -q -- "${opt%%=*}"; then flags="$flags $opt"; fi
          done
          echo "$flags"
        }
        sign_flags=""; attest_flags=""
        if [ "$FORMAT" = legacy ]; then sign_flags="$(legacy_flags sign)"; attest_flags="$(legacy_flags attest)"; fi
        key_flags=""; issuer="https://token.actions.githubusercontent.com"
        if [ "$MODE" = key ]; then
          [ -n "${COSIGN_PRIVATE_KEY:-}" ] || { echo "::error::sign=key but COSIGN_PRIVATE_KEY is empty"; exit 1; }
          key_flags="--key env://COSIGN_PRIVATE_KEY"; issuer="key"
        fi
        # shellcheck disable=SC2086
        cosign sign $key_flags $sign_flags "$ref"
        # shellcheck disable=SC2086
        cosign attest $key_flags $attest_flags --predicate "$SBOM" --type spdxjson "$ref"
        jq -n --arg mode "$MODE" --arg format "$FORMAT" --arg issuer "$issuer" --arg digest "$DIGEST" \
          '{signed: true, mode: $mode, format: $format, issuer: $issuer, digest: $digest}' > "$OUT/sign.json"
        { echo "signed=true"; echo "issuer=$issuer"; echo "output-dir=$OUT"; } >> "$GITHUB_OUTPUT"
        echo "signed $ref ($MODE, $FORMAT)" >> "$GITHUB_STEP_SUMMARY"
