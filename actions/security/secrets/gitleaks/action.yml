name: gitleaks
description: Secret scanning over the full git history with Gitleaks (JSON + generated SARIF, secrets redacted).
inputs:
  working-directory:
    description: Repository checkout (git mode scans the whole history regardless of subdirectory)
    default: source
  config:
    description: Gitleaks config passed as --config, relative to working-directory. Opt-in — nothing is auto-discovered when empty.
    default: ""
  output-dir:
    default: ""
outputs:
  findings:
    value: ${{ steps.scan.outputs.findings }}
  sarif:
    value: ${{ steps.scan.outputs.sarif }}
  output-dir:
    value: ${{ steps.scan.outputs.output-dir }}
runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG: ${{ inputs.config }}
        OUT_IN: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        ROOT="$(cd "$GITHUB_ACTION_PATH/../../../.." && pwd)"
        set -a; . "$ROOT/config/versions.env"; set +a
        OUT="${OUT_IN:-$RUNNER_TEMP/devsecops/secrets}"; mkdir -p "$OUT"; chmod 0777 "$OUT"
        ver="${GITLEAKS_IMAGE#*:}"; ver="${ver%%@*}"; ver="${ver#v}"
        # the checkout is bind-mounted at /repo, so a caller path has to be relative to it
        cfg=()
        if [ -n "$CONFIG" ]; then
          case "$CONFIG" in
            /*) echo "config must be relative to working-directory, got: $CONFIG" >&2; exit 1 ;;
          esac
          [ -f "$CONFIG" ] || { echo "config not found under $PWD: $CONFIG" >&2; exit 1; }
          cfg=(--config "/repo/$CONFIG")
        fi
        status=ok; reason=""
        set +e
        docker run --rm -v "$PWD:/repo" -v "$OUT:/out" \
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e 'GIT_CONFIG_VALUE_0=*' \
          "$GITLEAKS_IMAGE" git /repo --redact --exit-code 0 --no-banner \
          ${cfg[@]+"${cfg[@]}"} \
          --report-format json --report-path /out/gitleaks.json
        rc=$?
        set -e
        if [ "$rc" -ne 0 ]; then status=error; reason="gitleaks exited $rc"; fi
        [ -s "$OUT/gitleaks.json" ] || echo '[]' > "$OUT/gitleaks.json"
        python3 "$ROOT/scripts/normalize.py" --tool gitleaks --input "$OUT/gitleaks.json" --category secrets \
          --tool-version "$ver" --status "$status" --reason "$reason" --out "$OUT/findings-secrets.json"
        python3 "$ROOT/scripts/sarif.py" --findings "$OUT/findings-secrets.json" --out "$OUT/gitleaks.sarif"
        { echo "findings=$OUT/findings-secrets.json"; echo "sarif=$OUT/gitleaks.sarif"; echo "output-dir=$OUT"; } >> "$GITHUB_OUTPUT"
