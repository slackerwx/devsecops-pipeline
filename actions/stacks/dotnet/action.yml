name: dotnet stack
description: .NET SDK + restore; optionally build or test (phase).
inputs:
  working-directory:
    default: source
  version:
    default: 8.0.x
  package-manager:
    default: dotnet
  phase:
    description: setup | build | test
    default: setup
  command:
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: ${{ inputs.version }}
    - name: restore
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DOTNET_NOLOGO: "1"
        DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      run: |
        set -euo pipefail
        if find . -name packages.lock.json -not -path '*/bin/*' -not -path '*/obj/*' | grep -q .; then
          dotnet restore --locked-mode
        else
          echo "::warning::no packages.lock.json found; restore is not reproducible (set RestorePackagesWithLockFile=true)"
          dotnet restore
        fi
    - name: build
      if: inputs.phase == 'build'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CMD: ${{ inputs.command }}
        DOTNET_NOLOGO: "1"
      run: |
        set -euo pipefail
        if [ -n "$CMD" ]; then bash -c "$CMD"; else dotnet build --no-restore -c Release; fi
    - name: test
      if: inputs.phase == 'test'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CMD: ${{ inputs.command }}
        DOTNET_NOLOGO: "1"
      run: |
        set -euo pipefail
        if [ -n "$CMD" ]; then bash -c "$CMD"; else dotnet test --no-restore -c Release --logger trx --results-directory reports; fi
