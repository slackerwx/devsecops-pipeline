name: devsecops-pipeline

# Callers of this workflow must grant these permissions on the calling job
# (GitHub Actions requires a called workflow's job permissions to be a subset
# of the caller's):
#   contents: read
#   pull-requests: write     # evidence job comments the findings summary on PRs
#   packages: write          # image job pushes the built image, sign job attaches the signature
#   security-events: write   # evidence job can upload SARIF to code scanning when upload-sarif is true
#   id-token: write          # sign job's keyless OIDC signing
# Missing any of these fails the whole run at startup with zero jobs created,
# not a normal job failure — see .github/workflows/ci.yml's dogfood job.
on:
  workflow_call:
    inputs:
      stack:
        description: auto | node | python | go | java | dotnet
        type: string
        default: auto
      working-directory:
        description: App root inside the repository
        type: string
        default: "."
      mode:
        description: enforce | audit
        type: string
        default: enforce
      runner:
        description: runs-on label
        type: string
        default: ubuntu-latest
      toolchain-version:
        description: Overrides the detected toolchain version
        type: string
        default: ""
      build-command:
        type: string
        default: ""
      test-command:
        type: string
        default: ""
      skip-stages:
        description: Comma list of build,test,secrets,sast,sca,iac,image,dast,sign
        type: string
        default: ""
      dockerfile:
        type: string
        default: Dockerfile
      image-name:
        description: Defaults to <registry>/<owner>/<repo>[/<slug>]
        type: string
        default: ""
      registry:
        type: string
        default: ghcr.io
      platforms:
        type: string
        default: linux/amd64
      push:
        description: auto | always | never
        type: string
        default: auto
      build-args:
        description: Multiline KEY=VALUE
        type: string
        default: ""
      app-port:
        description: Enables ephemeral DAST against the candidate image
        type: string
        default: ""
      app-health-path:
        type: string
        default: /
      app-env:
        description: Multiline KEY=VALUE for the ephemeral container (non-secret)
        type: string
        default: ""
      dast-target-url:
        type: string
        default: ""
      fail-on:
        description: Per-category thresholds
        type: string
        default: secrets=any,sast=high,sca=high,container=critical,iac=high,dast=high,license=none
      ignore-unfixed:
        type: boolean
        default: true
      semgrep-rulesets:
        description: Comma list of p/ packs or paths; empty = pipeline defaults + stack pack
        type: string
        default: ""
      sign:
        description: keyless | key | none
        type: string
        default: keyless
      cosign-signature-format:
        description: legacy | bundle
        type: string
        default: legacy
      pr-comment:
        type: boolean
        default: true
      upload-sarif:
        type: boolean
        default: false
      evidence-retention-days:
        type: number
        default: 30
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false
      COSIGN_PRIVATE_KEY:
        required: false
      COSIGN_PASSWORD:
        required: false
      EVIDENCE_WEBHOOK_URL:
        required: false
      EVIDENCE_WEBHOOK_TOKEN:
        required: false
    outputs:
      image:
        description: Image repository (no tag)
        value: ${{ jobs.image.outputs.image }}
      digest:
        value: ${{ jobs.image.outputs.digest }}
      tags:
        description: Newline-separated tags
        value: ${{ jobs.image.outputs.tags }}
      pushed:
        value: ${{ jobs.image.outputs.pushed }}
      signed:
        value: ${{ jobs.sign.outputs.signed }}
      verdict:
        description: pass | fail
        value: ${{ jobs.evidence.outputs.verdict }}
      failed-categories:
        value: ${{ jobs.evidence.outputs.failed-categories }}
      evidence-artifact:
        value: ${{ jobs.evidence.outputs.evidence-artifact }}
      sbom-artifact:
        value: ${{ jobs.image.outputs.sbom-artifact }}

permissions: {}

jobs:
  plan:
    name: plan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      stack: ${{ steps.detect.outputs.stack }}
      package-manager: ${{ steps.detect.outputs.package-manager }}
      toolchain-version: ${{ steps.detect.outputs.toolchain-version }}
      has-dockerfile: ${{ steps.detect.outputs.has-dockerfile }}
      has-iac: ${{ steps.detect.outputs.has-iac }}
      image-name: ${{ steps.detect.outputs.image-name }}
      push: ${{ steps.detect.outputs.push }}
      dast-mode: ${{ steps.detect.outputs.dast-mode }}
      dast-skip-reason: ${{ steps.detect.outputs.dast-skip-reason }}
      slug: ${{ steps.detect.outputs.slug }}
      stages: ${{ steps.detect.outputs.stages }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          persist-credentials: false
      - id: detect
        uses: ./.pipeline/actions/detect
        with:
          working-directory: ${{ inputs.working-directory }}
          stack: ${{ inputs.stack }}
          toolchain-version: ${{ inputs.toolchain-version }}
          dockerfile: ${{ inputs.dockerfile }}
          image-name: ${{ inputs.image-name }}
          registry: ${{ inputs.registry }}
          push: ${{ inputs.push }}
          skip-stages: ${{ inputs.skip-stages }}
          app-port: ${{ inputs.app-port }}
          dast-target-url: ${{ inputs.dast-target-url }}
          sign: ${{ inputs.sign }}
          default-branch: ${{ github.event.repository.default_branch }}

  build:
    name: build
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.stages).build }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          persist-credentials: false
      - if: needs.plan.outputs.stack == 'node'
        uses: ./.pipeline/actions/stacks/node
        with:
          working-directory: source/${{ inputs.working-directory }}
          version: ${{ needs.plan.outputs.toolchain-version }}
          package-manager: ${{ needs.plan.outputs.package-manager }}
          phase: build
          command: ${{ inputs.build-command }}
      - if: needs.plan.outputs.stack == 'python'
        uses: ./.pipeline/actions/stacks/python
        with:
          working-directory: source/${{ inputs.working-directory }}
          version: ${{ needs.plan.outputs.toolchain-version }}
          package-manager: ${{ needs.plan.outputs.package-manager }}
          phase: build
          command: ${{ inputs.build-command }}
      - if: needs.plan.outputs.stack == 'go'
        uses: ./.pipeline/actions/stacks/go
        with:
          working-directory: source/${{ inputs.working-directory }}
          version: ${{ needs.plan.outputs.toolchain-version }}
          phase: build
          command: ${{ inputs.build-command }}
      - if: needs.plan.outputs.stack == 'java'
        uses: ./.pipeline/actions/stacks/java
        with:
          working-directory: source/${{ inputs.working-directory }}
          version: ${{ needs.plan.outputs.toolchain-version }}
          package-manager: ${{ needs.plan.outputs.package-manager }}
          phase: build
          command: ${{ inputs.build-command }}
      - if: needs.plan.outputs.stack == 'dotnet'
        uses: ./.pipeline/actions/stacks/dotnet
        with:
          working-directory: source/${{ inputs.working-directory }}
          version: ${{ needs.plan.outputs.toolchain-version }}
          phase: build
          command: ${{ inputs.build-command }}

  test:
    name: test
    needs: [plan, build]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.stages).test && needs.build.result != 'failure' && needs.build.result != 'cancelled' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          persist-credentials: false
      - if: needs.plan.outputs.stack == 'node'
        uses: ./.pipeline/actions/stacks/node
        with:
          working-directory: source/${{ inputs.working-directory }}
          version: ${{ needs.plan.outputs.toolchain-version }}
          package-manager: ${{ needs.plan.outputs.package-manager }}
          phase: test
          command: ${{ inputs.test-command }}
      - if: needs.plan.outputs.stack == 'python'
        uses: ./.pipeline/actions/stacks/python
        with:
          working-directory: source/${{ inputs.working-directory }}
          version: ${{ needs.plan.outputs.toolchain-version }}
          package-manager: ${{ needs.plan.outputs.package-manager }}
          phase: test
          command: ${{ inputs.test-command }}
      - if: needs.plan.outputs.stack == 'go'
        uses: ./.pipeline/actions/stacks/go
        with:
          working-directory: source/${{ inputs.working-directory }}
          version: ${{ needs.plan.outputs.toolchain-version }}
          phase: test
          command: ${{ inputs.test-command }}
      - if: needs.plan.outputs.stack == 'java'
        uses: ./.pipeline/actions/stacks/java
        with:
          working-directory: source/${{ inputs.working-directory }}
          version: ${{ needs.plan.outputs.toolchain-version }}
          package-manager: ${{ needs.plan.outputs.package-manager }}
          phase: test
          command: ${{ inputs.test-command }}
      - if: needs.plan.outputs.stack == 'dotnet'
        uses: ./.pipeline/actions/stacks/dotnet
        with:
          working-directory: source/${{ inputs.working-directory }}
          version: ${{ needs.plan.outputs.toolchain-version }}
          phase: test
          command: ${{ inputs.test-command }}
      - name: upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devsecops-${{ needs.plan.outputs.slug }}-test-reports
          if-no-files-found: ignore
          retention-days: ${{ inputs.evidence-retention-days }}
          path: |
            source/${{ inputs.working-directory }}/**/junit*.xml
            source/${{ inputs.working-directory }}/**/TEST-*.xml
            source/${{ inputs.working-directory }}/**/*.trx
            source/${{ inputs.working-directory }}/**/test-results/**/*.xml
            source/${{ inputs.working-directory }}/**/coverage/**
            source/${{ inputs.working-directory }}/**/coverage.xml
            source/${{ inputs.working-directory }}/**/lcov.info
            !source/${{ inputs.working-directory }}/**/node_modules/**

  secrets:
    name: secrets
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.stages).secrets }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      EVIDENCE_WEBHOOK_URL: ${{ secrets.EVIDENCE_WEBHOOK_URL }}
      EVIDENCE_WEBHOOK_TOKEN: ${{ secrets.EVIDENCE_WEBHOOK_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          persist-credentials: false
      - id: scan
        uses: ./.pipeline/actions/security/secrets/gitleaks
        with:
          working-directory: source
      - if: always() && steps.scan.outputs.output-dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devsecops-${{ needs.plan.outputs.slug }}-secrets
          path: ${{ steps.scan.outputs.output-dir }}
          retention-days: ${{ inputs.evidence-retention-days }}
          if-no-files-found: ignore
      - if: always() && steps.scan.outputs.sarif != ''
        uses: ./.pipeline/actions/report/webhook
        with:
          sarif: ${{ steps.scan.outputs.sarif }}
      - uses: ./.pipeline/actions/report/gate
        with:
          category: secrets
          findings: ${{ steps.scan.outputs.findings }}
          fail-on: ${{ inputs.fail-on }}
          mode: ${{ inputs.mode }}

  sast:
    name: sast
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.stages).sast }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EVIDENCE_WEBHOOK_URL: ${{ secrets.EVIDENCE_WEBHOOK_URL }}
      EVIDENCE_WEBHOOK_TOKEN: ${{ secrets.EVIDENCE_WEBHOOK_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          persist-credentials: false
      - id: scan
        uses: ./.pipeline/actions/security/sast/semgrep
        with:
          working-directory: source/${{ inputs.working-directory }}
          stack: ${{ needs.plan.outputs.stack }}
          rulesets: ${{ inputs.semgrep-rulesets }}
      - if: always() && steps.scan.outputs.output-dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devsecops-${{ needs.plan.outputs.slug }}-sast
          path: ${{ steps.scan.outputs.output-dir }}
          retention-days: ${{ inputs.evidence-retention-days }}
          if-no-files-found: ignore
      - if: always() && steps.scan.outputs.sarif != ''
        uses: ./.pipeline/actions/report/webhook
        with:
          sarif: ${{ steps.scan.outputs.sarif }}
      - uses: ./.pipeline/actions/report/gate
        with:
          category: sast
          findings: ${{ steps.scan.outputs.findings }}
          fail-on: ${{ inputs.fail-on }}
          mode: ${{ inputs.mode }}

  sca:
    name: sca
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.stages).sca }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EVIDENCE_WEBHOOK_URL: ${{ secrets.EVIDENCE_WEBHOOK_URL }}
      EVIDENCE_WEBHOOK_TOKEN: ${{ secrets.EVIDENCE_WEBHOOK_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          persist-credentials: false
      - id: scan
        uses: ./.pipeline/actions/security/sca/trivy-fs
        with:
          working-directory: source/${{ inputs.working-directory }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
      - if: always() && steps.scan.outputs.output-dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devsecops-${{ needs.plan.outputs.slug }}-sca
          path: ${{ steps.scan.outputs.output-dir }}
          retention-days: ${{ inputs.evidence-retention-days }}
          if-no-files-found: ignore
      - if: always() && steps.scan.outputs.sarif != ''
        uses: ./.pipeline/actions/report/webhook
        with:
          sarif: ${{ steps.scan.outputs.sarif }}
      - uses: ./.pipeline/actions/report/gate
        with:
          category: license
          findings: ${{ steps.scan.outputs.findings-license }}
          fail-on: ${{ inputs.fail-on }}
          mode: ${{ inputs.mode }}
      - uses: ./.pipeline/actions/report/gate
        with:
          category: sca
          findings: ${{ steps.scan.outputs.findings-sca }}
          fail-on: ${{ inputs.fail-on }}
          mode: ${{ inputs.mode }}

  iac:
    name: iac
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.stages).iac }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      EVIDENCE_WEBHOOK_URL: ${{ secrets.EVIDENCE_WEBHOOK_URL }}
      EVIDENCE_WEBHOOK_TOKEN: ${{ secrets.EVIDENCE_WEBHOOK_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          persist-credentials: false
      - id: trivy
        uses: ./.pipeline/actions/security/iac/trivy-config
        with:
          working-directory: source/${{ inputs.working-directory }}
          output-dir: ${{ runner.temp }}/devsecops/iac
      - id: hadolint
        uses: ./.pipeline/actions/security/iac/hadolint
        with:
          working-directory: source/${{ inputs.working-directory }}
          dockerfile: ${{ inputs.dockerfile }}
          output-dir: ${{ runner.temp }}/devsecops/iac
          append: "true"
      - if: always() && steps.trivy.outputs.output-dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devsecops-${{ needs.plan.outputs.slug }}-iac
          path: ${{ steps.trivy.outputs.output-dir }}
          retention-days: ${{ inputs.evidence-retention-days }}
          if-no-files-found: ignore
      - if: always() && steps.trivy.outputs.sarif != ''
        uses: ./.pipeline/actions/report/webhook
        with:
          sarif: ${{ steps.trivy.outputs.sarif }}
      - if: always() && steps.hadolint.outputs.sarif != ''
        uses: ./.pipeline/actions/report/webhook
        with:
          sarif: ${{ steps.hadolint.outputs.sarif }}
      - uses: ./.pipeline/actions/report/gate
        with:
          category: iac
          findings: ${{ steps.trivy.outputs.findings }}
          fail-on: ${{ inputs.fail-on }}
          mode: ${{ inputs.mode }}

  image:
    name: image
    needs: [plan, build, test, secrets, sast, sca, iac]
    if: >-
      ${{ !cancelled() && fromJSON(needs.plan.outputs.stages).image
          && needs.build.result != 'failure' && needs.build.result != 'cancelled'
          && needs.test.result != 'failure' && needs.test.result != 'cancelled'
          && needs.secrets.result != 'failure' && needs.secrets.result != 'cancelled'
          && needs.sast.result != 'failure' && needs.sast.result != 'cancelled'
          && needs.sca.result != 'failure' && needs.sca.result != 'cancelled'
          && needs.iac.result != 'failure' && needs.iac.result != 'cancelled' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write   # pushes the scanned image to the registry when the caller asked for it
    outputs:
      image: ${{ needs.plan.outputs.image-name }}
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.build.outputs.tags }}
      pushed: ${{ steps.push.outputs.pushed || 'false' }}
      sbom-artifact: ${{ steps.push.outputs.pushed == 'true' && format('devsecops-{0}-sbom', needs.plan.outputs.slug) || '' }}
    env:
      EVIDENCE_WEBHOOK_URL: ${{ secrets.EVIDENCE_WEBHOOK_URL }}
      EVIDENCE_WEBHOOK_TOKEN: ${{ secrets.EVIDENCE_WEBHOOK_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          persist-credentials: false
      - id: build
        uses: ./.pipeline/actions/supply-chain/image-build
        with:
          context: source/${{ inputs.working-directory }}
          dockerfile: ${{ inputs.dockerfile }}
          image-name: ${{ needs.plan.outputs.image-name }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          scope: ${{ needs.plan.outputs.slug }}
      - id: scan
        uses: ./.pipeline/actions/security/container/trivy-image
        with:
          image: ${{ steps.build.outputs.local-tag }}
          working-directory: source/${{ inputs.working-directory }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
      - if: always() && steps.scan.outputs.output-dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devsecops-${{ needs.plan.outputs.slug }}-container
          path: ${{ steps.scan.outputs.output-dir }}
          retention-days: ${{ inputs.evidence-retention-days }}
          if-no-files-found: ignore
      - if: always() && steps.scan.outputs.sarif != ''
        uses: ./.pipeline/actions/report/webhook
        with:
          sarif: ${{ steps.scan.outputs.sarif }}
      - uses: ./.pipeline/actions/report/gate
        with:
          category: container
          findings: ${{ steps.scan.outputs.findings }}
          fail-on: ${{ inputs.fail-on }}
          mode: ${{ inputs.mode }}
      - if: needs.plan.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}
      - id: push
        if: needs.plan.outputs.push == 'true'
        uses: ./.pipeline/actions/supply-chain/image-push
        with:
          context: source/${{ inputs.working-directory }}
          dockerfile: ${{ inputs.dockerfile }}
          image-name: ${{ needs.plan.outputs.image-name }}
          tags: ${{ steps.build.outputs.tags }}
          labels: ${{ steps.build.outputs.labels }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          scope: ${{ needs.plan.outputs.slug }}
          output-dir: ${{ runner.temp }}/devsecops/image
      - if: steps.push.outputs.pushed == 'true'
        uses: ./.pipeline/actions/report/webhook
        with:
          event-type: image.pushed
          payload: ${{ format('{{"image":"{0}","digest":"{1}"}}', steps.push.outputs.primary-tag, steps.push.outputs.digest) }}
      - if: steps.push.outputs.pushed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devsecops-${{ needs.plan.outputs.slug }}-image
          path: ${{ steps.push.outputs.output-dir }}
          retention-days: ${{ inputs.evidence-retention-days }}
      - id: sbom
        if: steps.push.outputs.pushed == 'true'
        uses: ./.pipeline/actions/supply-chain/sbom/syft
        with:
          image: ${{ needs.plan.outputs.image-name }}
          digest: ${{ steps.push.outputs.digest }}
          output-dir: ${{ runner.temp }}/devsecops/sbom
      - if: steps.push.outputs.pushed == 'true'
        uses: ./.pipeline/actions/report/webhook
        with:
          event-type: sbom.created
          payload: ${{ format('{{"packages":{0},"format":"spdx-json"}}', steps.sbom.outputs.packages) }}
      - if: steps.push.outputs.pushed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devsecops-${{ needs.plan.outputs.slug }}-sbom
          path: ${{ steps.sbom.outputs.output-dir }}
          retention-days: ${{ inputs.evidence-retention-days }}

  dast:
    name: dast
    needs: [plan, image]
    if: >-
      ${{ !cancelled() && fromJSON(needs.plan.outputs.stages).dast
          && (needs.plan.outputs.dast-mode == 'external'
              || (needs.image.result == 'success' && needs.image.outputs.pushed == 'true')) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read    # pulls the candidate image back from the registry to run it as an ephemeral target
    env:
      EVIDENCE_WEBHOOK_URL: ${{ secrets.EVIDENCE_WEBHOOK_URL }}
      EVIDENCE_WEBHOOK_TOKEN: ${{ secrets.EVIDENCE_WEBHOOK_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          persist-credentials: false
      - if: needs.plan.outputs.dast-mode == 'ephemeral'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}
      - id: scan
        uses: ./.pipeline/actions/security/dast/zap-baseline
        with:
          target-url: ${{ inputs.dast-target-url }}
          image: ${{ needs.image.outputs.image }}
          digest: ${{ needs.image.outputs.digest }}
          app-port: ${{ inputs.app-port }}
          app-health-path: ${{ inputs.app-health-path }}
          app-env: ${{ inputs.app-env }}
          working-directory: source/${{ inputs.working-directory }}
      - if: always() && steps.scan.outputs.output-dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devsecops-${{ needs.plan.outputs.slug }}-dast
          path: ${{ steps.scan.outputs.output-dir }}
          retention-days: ${{ inputs.evidence-retention-days }}
          if-no-files-found: ignore
      - if: always() && steps.scan.outputs.sarif != ''
        uses: ./.pipeline/actions/report/webhook
        with:
          sarif: ${{ steps.scan.outputs.sarif }}
      - uses: ./.pipeline/actions/report/gate
        with:
          category: dast
          findings: ${{ steps.scan.outputs.findings }}
          fail-on: ${{ inputs.fail-on }}
          mode: ${{ inputs.mode }}

  sign:
    name: sign
    needs: [plan, image, dast]
    if: >-
      ${{ !cancelled() && fromJSON(needs.plan.outputs.stages).sign
          && needs.image.result == 'success' && needs.image.outputs.pushed == 'true'
          && needs.dast.result != 'failure' && needs.dast.result != 'cancelled' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write   # cosign attaches the signature and the SBOM attestation to the pushed image
      id-token: write   # keyless signing mints a short-lived OIDC token for Fulcio
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    env:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      EVIDENCE_WEBHOOK_URL: ${{ secrets.EVIDENCE_WEBHOOK_URL }}
      EVIDENCE_WEBHOOK_TOKEN: ${{ secrets.EVIDENCE_WEBHOOK_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.image.outputs.sbom-artifact }}
          path: sbom
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}
      - id: sign
        uses: ./.pipeline/actions/supply-chain/sign/cosign
        with:
          image: ${{ needs.image.outputs.image }}
          digest: ${{ needs.image.outputs.digest }}
          mode: ${{ inputs.sign }}
          format: ${{ inputs.cosign-signature-format }}
          sbom: sbom/sbom.spdx.json
          output-dir: ${{ runner.temp }}/devsecops/sign
      - if: steps.sign.outputs.signed == 'true'
        uses: ./.pipeline/actions/report/webhook
        with:
          event-type: image.signed
          payload: ${{ format('{{"digest":"{0}","issuer":"{1}"}}', needs.image.outputs.digest, steps.sign.outputs.issuer) }}
      - if: always() && steps.sign.outputs.output-dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devsecops-${{ needs.plan.outputs.slug }}-sign
          path: ${{ steps.sign.outputs.output-dir }}
          retention-days: ${{ inputs.evidence-retention-days }}

  evidence:
    name: evidence
    needs: [plan, build, test, secrets, sast, sca, iac, image, dast, sign]
    if: ${{ always() }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write     # keeps the sticky findings comment up to date on the pull request
      security-events: write   # uploads the consolidated SARIF to GitHub code scanning when upload-sarif is on
    outputs:
      verdict: ${{ steps.ev.outputs.verdict }}
      failed-categories: ${{ steps.ev.outputs.failed-categories }}
      evidence-artifact: devsecops-${{ needs.plan.outputs.slug }}-evidence
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_WEBHOOK_URL: ${{ secrets.EVIDENCE_WEBHOOK_URL }}
      EVIDENCE_WEBHOOK_TOKEN: ${{ secrets.EVIDENCE_WEBHOOK_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: devsecops-${{ needs.plan.outputs.slug }}-*
          path: evidence
          merge-multiple: false
      - id: ev
        uses: ./.pipeline/actions/report/evidence
        with:
          evidence-dir: evidence
          fail-on: ${{ inputs.fail-on }}
          mode: ${{ inputs.mode }}
          stack: ${{ needs.plan.outputs.stack }}
          working-directory: ${{ inputs.working-directory }}
          stages: ${{ needs.plan.outputs.stages }}
          slug: ${{ needs.plan.outputs.slug }}
          pr-comment: ${{ inputs.pr-comment }}
          pr-number: ${{ github.event.pull_request.number }}
      - if: inputs.upload-sarif
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          sarif_file: evidence/sarif
          category: devsecops-${{ needs.plan.outputs.slug }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devsecops-${{ needs.plan.outputs.slug }}-evidence
          path: evidence
          retention-days: ${{ inputs.evidence-retention-days }}
