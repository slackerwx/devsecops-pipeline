name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: lint suite
        env:
          GITHUB_TOKEN: ${{ github.token }}   # pinact resolves refs through the API; avoids anonymous rate limits
        run: make lint
      - name: hadolint on fixture Dockerfiles
        run: |
          set -euo pipefail
          set -a; . config/versions.env; set +a
          shopt -s nullglob
          for f in tests/fixtures/*/Dockerfile; do
            echo "== $f"
            docker run --rm -i "$HADOLINT_IMAGE" hadolint - < "$f"
          done

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: make unit

  dogfood:
    name: dogfood (${{ matrix.stack }})
    needs: [lint, unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: node
            port: "3000"
    permissions:
      contents: read
      packages: write        # the image stage pushes the fixture image to GHCR
      id-token: write        # keyless signing mints an OIDC token
      pull-requests: write   # the evidence stage comments the findings summary on the PR
    uses: ./.github/workflows/pipeline.yml
    with:
      working-directory: tests/fixtures/${{ matrix.stack }}
      app-port: ${{ matrix.port }}
      image-name: ghcr.io/${{ github.repository }}/fixture-${{ matrix.stack }}
      push: ${{ github.event_name == 'push' && 'always' || 'never' }}

  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, unit, dogfood]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every needed job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null || { echo "a needed job did not succeed"; echo "$RESULTS"; exit 1; }
