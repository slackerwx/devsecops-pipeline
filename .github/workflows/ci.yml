name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: lint suite
        env:
          GITHUB_TOKEN: ${{ github.token }}   # pinact resolves refs through the API; avoids anonymous rate limits
        run: make lint
      - name: hadolint on fixture Dockerfiles
        run: |
          set -euo pipefail
          set -a; . config/versions.env; set +a
          shopt -s nullglob
          for f in tests/fixtures/*/Dockerfile; do
            # the vulnerable fixture's Dockerfile is bad on purpose; the pipeline's own
            # audit-mode dogfood run is what asserts hadolint/trivy flag it
            case "$f" in *vulnerable*) continue ;; esac
            echo "== $f"
            docker run --rm -i "$HADOLINT_IMAGE" hadolint - < "$f"
          done

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: make unit

  dogfood:
    name: dogfood (${{ matrix.stack }})
    needs: [lint, unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: node
            port: "3000"
          - stack: python
            port: "5000"
          - stack: go
            port: "8080"
          - stack: java
            port: "8080"
          - stack: dotnet
            port: "8080"
    permissions:
      contents: read
      packages: write        # the image stage pushes the fixture image to GHCR
      id-token: write        # keyless signing mints an OIDC token
      pull-requests: write   # the evidence stage comments the findings summary on the PR
      security-events: write # the evidence stage can upload the consolidated SARIF to code scanning
    uses: ./.github/workflows/pipeline.yml
    with:
      working-directory: tests/fixtures/${{ matrix.stack }}
      app-port: ${{ matrix.port }}
      image-name: ghcr.io/${{ github.repository }}/fixture-${{ matrix.stack }}
      push: ${{ github.event_name == 'push' && 'always' || 'never' }}
      # Gitleaks runs in git mode over the whole repository history, so every dogfood run
      # sees tests/fixtures/vulnerable-node/secrets/fake_id_rsa — the key the audit-mode
      # dogfood-vulnerable job is meant to catch. Allowlisting that one path keeps the
      # default secrets=any threshold enforcing for every other secret in this repo.
      gitleaks-config: .gitleaks-ci-allowlist.toml

  dogfood-vulnerable:
    name: dogfood (vulnerable-node, audit)
    needs: [lint, unit]
    permissions:
      contents: read
      packages: write        # the image stage pushes the fixture image to GHCR
      id-token: write        # keyless signing mints an OIDC token
      pull-requests: write   # the evidence stage comments the findings summary on the PR
      security-events: write # the evidence stage can upload the consolidated SARIF to code scanning
    uses: ./.github/workflows/pipeline.yml
    with:
      working-directory: tests/fixtures/vulnerable-node
      mode: audit
      push: never
      pr-comment: false

  dogfood-assert:
    name: dogfood-assert
    needs: dogfood-vulnerable
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: audit run stays green but reports the planted findings
        env:
          RESULT: ${{ needs.dogfood-vulnerable.result }}
          VERDICT: ${{ needs.dogfood-vulnerable.outputs.verdict }}
          FAILED: ${{ needs.dogfood-vulnerable.outputs.failed-categories }}
        run: |
          set -euo pipefail
          echo "result=$RESULT verdict=$VERDICT failed=$FAILED"
          [ "$RESULT" = success ] || { echo "audit-mode run must succeed"; exit 1; }
          [ "$VERDICT" = fail ] || { echo "expected verdict=fail"; exit 1; }
          for c in secrets sca iac; do
            echo "$FAILED" | tr ',' '\n' | grep -qx "$c" || { echo "expected $c among failed categories"; exit 1; }
          done

  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, unit, dogfood, dogfood-assert]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every needed job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null || { echo "a needed job did not succeed"; echo "$RESULTS"; exit 1; }
