name: pipeline
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt -r requirements-dev.txt && pytest
        env: {TEST_DATABASE_URL: postgresql://app:app@localhost:5432/app_test}
  devsecops:
    needs: test
    uses: slackerwx/devsecops-pipeline/.github/workflows/pipeline.yml@d746477802a801bab9a5a20b7f8934498d234d25 # v1.0.0
    with:
      skip-stages: test
