name: dast-staging
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: read
jobs:
  dast:
    uses: slackerwx/devsecops-pipeline/.github/workflows/pipeline.yml@d746477802a801bab9a5a20b7f8934498d234d25 # v1.0.0
    with:
      skip-stages: build,test,secrets,sast,sca,iac,image,sign
      dast-target-url: https://staging.example.com
      fail-on: dast=medium
